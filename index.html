<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Bomb - เกมระเบิดเวลา</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap');

        :root {
            --primary: #ff416c;
            --secondary: #ff4b2b;
            --safe: #00b09b;
            --safe-dark: #96c93d;
            --bg-color: #0f0f13;
            --text-main: #ffffff;
            --text-muted: #888899;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 65, 108, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 176, 155, 0.15), transparent 25%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease;
            touch-action: manipulation; /* ป้องกันการซูมเมื่อเคาะรัวๆ บนมือถือ */
            -webkit-user-select: none; /* ป้องกันการคลุมดำข้อความเมื่อเคาะรัวๆ */
            user-select: none;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(30, 30, 35, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 50px 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        h1, h2 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        
        h2 { font-size: 1.8rem; margin-bottom: 20px; }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .target-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .target-display span {
            display: block;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .target-display strong {
            display: block;
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            margin-top: 5px;
        }

        .timer-display {
            font-size: 4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* Input fields */
        .player-input-group {
            display: flex;
            margin-bottom: 12px;
            align-items: center;
        }
        .player-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-family: 'Kanit', sans-serif;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.2s;
        }
        .player-input-group input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }
        .remove-btn {
            background: none;
            border: none;
            color: #ff4b2b;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 0 0 15px;
            transition: transform 0.2s;
        }
        .remove-btn:hover {
            transform: scale(1.2);
        }
        .add-player-btn {
            background: transparent;
            border: 1px dashed rgba(255,255,255,0.3);
            color: var(--text-main);
            border-radius: 10px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            margin-bottom: 25px;
            transition: all 0.2s;
        }
        .add-player-btn:hover {
            border-color: var(--primary);
            background: rgba(255, 65, 108, 0.1);
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 18px 40px;
            font-size: 1.5rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-family: 'Kanit', sans-serif;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }

        .btn:hover::after {
            left: 150%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 65, 108, 0.4);
        }

        .btn:active {
            transform: translateY(2px) scale(0.98);
        }

        .btn.btn-stop {
            background: linear-gradient(135deg, #f12711, #f5af19);
            box-shadow: 0 10px 20px rgba(241, 39, 17, 0.3);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(241, 39, 17, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(241, 39, 17, 0); }
            100% { box-shadow: 0 0 0 0 rgba(241, 39, 17, 0); }
        }

        .hidden { display: none !important; }

        /* Jumpscare Elements */
        #jumpscare-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #jumpscare-img {
            width: 100%; height: 100%;
            object-fit: cover;
            animation: shake 0.05s infinite, flash 0.15s infinite;
        }

        @keyframes shake {
            0% { transform: translate(5px, 5px) scale(1.1); }
            25% { transform: translate(-5px, -5px) scale(1.1); }
            50% { transform: translate(5px, -5px) scale(1.1); }
            75% { transform: translate(-5px, 5px) scale(1.1); }
            100% { transform: translate(5px, 5px) scale(1.1); }
        }

        @keyframes flash {
            0%, 100% { filter: invert(0%) brightness(1); }
            50% { filter: invert(100%) brightness(2) contrast(3); }
        }

        .player-badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.3);
            font-weight: bold;
        }

        .badge-color-0 { color: #00e5ff; border-color: rgba(0, 229, 255, 0.3); }
        .badge-color-1 { color: #ff4081; border-color: rgba(255, 64, 129, 0.3); }
        .badge-color-2 { color: #b2ff59; border-color: rgba(178, 255, 89, 0.3); }
        .badge-color-3 { color: #ffff00; border-color: rgba(255, 255, 0, 0.3); }
        .badge-color-4 { color: #e040fb; border-color: rgba(224, 64, 251, 0.3); }

    </style>
</head>
<body>

    <!-- Audio Element สำหรับเสียงผี -->
    <audio id="jumpscare-audio" src="scary.mp3" preload="auto"></audio>

    <!-- Menu Screen -->
    <div class="glass-card" id="screen-menu">
        <h1>ระเบิดเวลา 💣</h1>
        <p class="subtitle">สลับกันกดเริ่มและกดหยุดเวลา เวลารวมจะถูกซ่อนไว้ตอนกำลังเดิน!<br>ใครทำเวลาทะลุเป้าหมาย... โดนผีหลอก!</p>
        <button class="btn" onclick="showSetup()">เล่นเกมเลย</button>
    </div>

    <!-- Setup Screen -->
    <div class="glass-card hidden" id="screen-setup">
        <h2>ตั้งค่าผู้เล่น</h2>
        <div id="player-list-container" style="text-align: left; max-height: 250px; overflow-y: auto; padding-right: 10px; margin-bottom: 15px;">
            <!-- Player inputs will be injected here -->
        </div>
        <button class="add-player-btn" onclick="addPlayerInput()">+ เพิ่มผู้เล่น</button>
        <button class="btn" onclick="initGame()">เริ่มระเบิด!</button>
    </div>

    <!-- Gameplay Screen -->
    <div class="glass-card hidden" id="screen-gameplay">
        <div class="player-badge badge-color-0" id="player-indicator">👤 ผู้เล่นคนที่ 1</div>
        
        <div class="target-display">
            <span>เป้าหมายระเบิดเวลา</span>
            <strong id="target-time-text">0.00 วินาที</strong>
        </div>

        <div class="timer-display" id="timer-text">0.00</div>
        
        <p class="subtitle" id="game-message">กดเริ่มเมื่อคุณพร้อม!</p>

        <button class="btn" id="action-btn" onclick="handleAction()">เริ่มจับเวลา</button>
    </div>

    <!-- Jumpscare Screen -->
    <div id="jumpscare-container">
        <img src="jumpscare.jpg" id="jumpscare-img" alt="Scary Face">
        <button class="btn" style="position: absolute; bottom: 50px; width: auto; z-index: 10000; box-shadow: 0 0 20px black;" onclick="resetToMenu()">กลับหน้าแรก</button>
    </div>

    <script>
        let gameState = 'IDLE'; // IDLE, RUNNING
        let globalTargetTime = 0;
        let accumulatedTime = 0;
        let turnStartTime = 0;
        let startAccumulated = 0;
        let timerInterval;
        
        let players = [];
        let currentPlayerIndex = 0;

        const jumpScareAudio = document.getElementById('jumpscare-audio');
        let audioUnlocked = false;

        const ui = {
            menu: document.getElementById('screen-menu'),
            setup: document.getElementById('screen-setup'),
            gameplay: document.getElementById('screen-gameplay'),
            targetTimeText: document.getElementById('target-time-text'),
            timerText: document.getElementById('timer-text'),
            actionBtn: document.getElementById('action-btn'),
            playerIndicator: document.getElementById('player-indicator'),
            gameMessage: document.getElementById('game-message'),
            jumpscare: document.getElementById('jumpscare-container'),
            playerListContainer: document.getElementById('player-list-container')
        };

        // ฟังก์ชันสำคัญสำหรับปลดล็อกเสียงบน iPad / iOS
        // ระบบ iOS จะไม่อนุญาตให้เสียงดังขึ้นมาเองหากไม่มีการคลิก
        // เราจึงต้องทำเป็นกดเล่นเสียงเงียบๆ ไว้ก่อน 1 ครั้ง
        function unlockAudio() {
            if (audioUnlocked) return;
            
            jumpScareAudio.volume = 0; // ปิดเสียงชั่วคราว
            const playPromise = jumpScareAudio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    jumpScareAudio.pause();
                    jumpScareAudio.currentTime = 0;
                    jumpScareAudio.volume = 1; // เปิดเสียงคืน
                    audioUnlocked = true;
                }).catch(error => {
                    console.log("Audio unlock failed:", error);
                });
            } else {
                jumpScareAudio.pause();
                jumpScareAudio.currentTime = 0;
                jumpScareAudio.volume = 1;
                audioUnlocked = true;
            }
        }

        // ---------- SETUP LOGIC ----------
        function showSetup() {
            unlockAudio(); // ปลดล็อกเสียงเมื่อผู้เล่นคลิกปุ่มแรก
            
            ui.menu.classList.add('hidden');
            ui.setup.classList.remove('hidden');
            
            // รีเซ็ตผู้เล่นเป็น 2 คนเริ่มต้น
            ui.playerListContainer.innerHTML = '';
            addPlayerInput('ผู้เล่นคนที่ 1');
            addPlayerInput('ผู้เล่นคนที่ 2');
        }

        function addPlayerInput(defaultName = '') {
            const count = ui.playerListContainer.children.length + 1;
            const div = document.createElement('div');
            div.className = 'player-input-group';
            div.innerHTML = `
                <input type="text" class="player-name-input" placeholder="ใส่ชื่อผู้เล่น..." value="${defaultName}">
                ${count > 2 ? '<button class="remove-btn" onclick="this.parentElement.remove()">✖</button>' : '<div style="width: 35px;"></div>'}
            `;
            ui.playerListContainer.appendChild(div);
        }

        function collectPlayers() {
            const inputs = document.querySelectorAll('.player-name-input');
            players = [];
            inputs.forEach((input, index) => {
                let name = input.value.trim();
                if (!name) name = `ผู้เล่น ${index + 1}`;
                players.push(name);
            });
            if (players.length < 2) {
                players = ['ผู้เล่น 1', 'ผู้เล่น 2']; 
            }
        }

        // ---------- GAME LOGIC ----------
        function initGame() {
            unlockAudio(); // ย้ำอีกครั้งเผื่อพลาด
            
            collectPlayers();
            ui.setup.classList.add('hidden');
            ui.gameplay.classList.remove('hidden');
            
            // สุ่มเวลาระเบิดระหว่าง 1 ถึง 20 วินาที
            globalTargetTime = (Math.random() * 19 + 1).toFixed(2);
            accumulatedTime = 0;
            currentPlayerIndex = 0;
            
            ui.targetTimeText.innerText = `${globalTargetTime} วินาที`;
            
            prepareTurn();
        }

        function prepareTurn() {
            gameState = 'IDLE';
            ui.timerText.innerText = accumulatedTime.toFixed(2);
            ui.timerText.style.color = "var(--text-main)";
            
            ui.actionBtn.innerText = "เริ่มจับเวลา";
            ui.actionBtn.className = "btn"; 
            
            const currentPlayerName = players[currentPlayerIndex];
            ui.gameMessage.innerText = `${currentPlayerName} พร้อมแล้วกดเริ่มเลย!`;
            
            ui.playerIndicator.innerText = `👤 ตาของ: ${currentPlayerName}`;
            ui.playerIndicator.className = `player-badge badge-color-${currentPlayerIndex % 5}`;
        }

        function handleAction() {
            unlockAudio();
            
            if (gameState === 'IDLE') {
                startTimer();
            } else if (gameState === 'RUNNING') {
                stopTimer();
            }
        }

        function startTimer() {
            gameState = 'RUNNING';
            turnStartTime = Date.now();
            startAccumulated = accumulatedTime;
            
            ui.timerText.style.color = "var(--text-main)";
            ui.timerText.innerText = "??.??"; 
            
            ui.actionBtn.innerText = "หยุดเวลา!";
            ui.actionBtn.className = "btn btn-stop";
            ui.gameMessage.innerText = "กำลังเดินเวลา... กะจังหวะให้ดีแล้วกดหยุด!";

            timerInterval = setInterval(() => {
                let currentTotal = startAccumulated + (Date.now() - turnStartTime) / 1000;
                
                if (currentTotal >= parseFloat(globalTargetTime)) {
                    clearInterval(timerInterval);
                    triggerJumpscare();
                }
            }, 10);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            let currentTotal = startAccumulated + (Date.now() - turnStartTime) / 1000;
            accumulatedTime = currentTotal;
            
            // ส่งต่อเทิร์น
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            const nextPlayerName = players[currentPlayerIndex];
            
            gameState = 'IDLE';
            ui.timerText.innerText = accumulatedTime.toFixed(2);
            ui.timerText.style.color = "var(--safe)";
            
            ui.actionBtn.innerText = "เริ่มจับเวลา";
            ui.actionBtn.className = "btn"; 
            
            ui.playerIndicator.innerText = `👤 ตาของ: ${nextPlayerName}`;
            ui.playerIndicator.className = `player-badge badge-color-${currentPlayerIndex % 5}`;
            
            ui.gameMessage.innerText = `รอดตัว! ส่งให้ ${nextPlayerName} ลุยต่อ`;
        }

        function triggerJumpscare() {
            ui.gameplay.classList.add('hidden');
            ui.jumpscare.style.display = 'flex';
            
            jumpScareAudio.currentTime = 0;
            jumpScareAudio.play().catch(e => console.log('Scare audio error:', e));
        }

        function resetToMenu() {
            ui.jumpscare.style.display = 'none';
            ui.menu.classList.remove('hidden');
            gameState = 'IDLE';
            
            jumpScareAudio.pause();
            jumpScareAudio.currentTime = 0;
        }
    </script>
</body>
</html>
